<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist -  আভরণী (Avaroni)</title>
    <meta name="description" content="View your saved wishlist items and favorite fashion products at  আভরণী (Avaroni).">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="আভরণী (Avaroni)">
    <meta property="og:title" content="My Wishlist -  আভরণী (Avaroni)">
    <meta property="og:description" content="View your saved wishlist items at Avaroni!">
    <meta property="og:image" content="./img/profile_image.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Wishlist -  আভরণী (Avaroni)">
    <meta name="twitter:description" content="View your saved wishlist items at Avaroni!">
    <meta name="twitter:image" content="./img/profile_image.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="./img/profile_image.jpg" alt="Logo" class="nav-logo">
            <B>আভরণী</B>
        </a>
        <!-- Search & Filter Bar -->
        <div class="search-bar-container">
            <div class="search-bar-inner">
                <div class="search-input-wrap">
                    <i class="fas fa-search search-bar-icon"></i>
                    <input type="text" id="global-search-input" placeholder="Search for products..." autocomplete="off">
                    <button id="search-clear-btn" class="search-clear-btn" style="display:none;"><i class="fas fa-times"></i></button>
                </div>
                <div class="search-filter-divider"></div>
                <div class="search-filter-wrapper">
                    <i class="fas fa-sliders-h search-filter-icon"></i>
                    <select id="global-filter-select" class="search-filter-select" title="Filter & Sort Products">
                        <option value="all">Filter & Sort</option>
                        <optgroup label="Price">
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                        </optgroup>
                        <optgroup label="Subcategories" id="filter-subcategories-group">
                        </optgroup>
                    </select>
                </div>
            </div>
            <div id="search-results-dropdown" class="search-results-dropdown"></div>
        </div>
        <div class="nav-links">
            <a href="wishlist.html" class="wishlist-icon" title="Wishlist"><i class="fas fa-heart" style="color: #e60050;"></i><span id="wishlist-count" class="wishlist-badge">0</span></a>
            <i id="menu-icon-btn" class="fas fa-bars menu-icon" style="cursor: pointer; font-size: 24px; margin-left: 15px; color: #333;"></i>
        </div>
    </nav>

    <!-- Promo Slider (below navbar) -->
    <div class="nav-promo-slider" id="nav-promo-slider"></div>

    <!-- 3-Dot Sidebar Drawer -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-brand">
                <img src="./img/profile_image.jpg" alt="Logo" class="sidebar-logo">
                <span>আভরণী</span>
            </a>
            <a href="javascript:void(0)" id="close-sidebar-btn" class="close-btn">&times;</a>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
        <a href="track-order.html"><i class="fas fa-truck"></i> Track Order</a>
        <a href="faq.html"><i class="fas fa-question-circle"></i> FAQ</a>
        <a href="blog.html"><i class="fas fa-newspaper"></i> Blog</a>
        <a href="sitemap.html"><i class="fas fa-sitemap"></i> Sitemap</a>
        <a href="return-product.html"><i class="fas fa-undo"></i> Return Product</a>
        <a href="return-policy.html"><i class="fas fa-file-contract"></i> Return Policy</a>
        <a href="about.html"><i class="fas fa-info-circle"></i> About Us</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <h2 class="page-title" style="text-align: center; margin: 25px 0;"><i class="fas fa-heart" style="color:#e60050;"></i> My Wishlist</h2>

    <div class="wishlist-container" style="max-width: 1200px; margin: 0 auto; padding: 0 15px 40px;">
        <div id="wishlist-grid" class="product-grid">
            <!-- Wishlist items populated dynamically by script.js -->
        </div>

        <div id="wishlist-empty-state" style="display: none; text-align: center; padding: 60px 20px;">
            <i class="far fa-heart" style="font-size: 60px; color: #ddd; margin-bottom: 20px;"></i>
            <h3 style="font-size: 20px; color: #555; margin-bottom: 10px;">Your wishlist is currently empty</h3>
            <p style="color: #777; margin-bottom: 25px;">Explore our products and tap the heart icon to save your favorites!</p>
            <a href="index.html" class="btn" style="display: inline-block; padding: 12px 28px; background: #e60050; color: white; border-radius: 25px; text-decoration: none; font-weight: 600;">Explore Products</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
