<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Register - आभाणी | Avaroni</title>
    <meta name="description" content="Sign in or create your Avaroni account using your Gmail, Phone number, or Google account.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="background: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="./img/profile_image.jpg" alt="Logo" class="nav-logo">
            <b>আভরণী</b>
        </a>
        <div class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <i id="menu-icon-btn" class="fas fa-bars menu-icon" style="cursor: pointer; font-size: 24px; margin-left: 15px; color: #333;"></i>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-brand">
                <img src="./img/profile_image.jpg" alt="Logo" class="sidebar-logo">
                <span>আভরণী</span>
            </a>
            <a href="#" id="close-sidebar-btn" class="close-btn">&times;</a>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="track-order.html"><i class="fas fa-truck"></i> Track Order</a>
        <a href="faq.html"><i class="fas fa-question-circle"></i> FAQ</a>
        <a href="about.html"><i class="fas fa-info-circle"></i> About Us</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <!-- MAIN AUTH CONTAINER -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 15px;">
        <div class="auth-box" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); width: 100%; max-width: 440px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 15px 35px rgba(0,0,0,0.08); padding: 35px 30px; transition: all 0.3s ease;">
            
            <!-- Auth Header & Tabs -->
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 id="auth-title" style="margin: 0 0 8px; font-size: 26px; font-weight: 700; color: #111;">Welcome Back</h2>
                <p id="auth-subtitle" style="margin: 0; font-size: 14px; color: #666;">Sign in to manage your account & orders</p>
            </div>

            <!-- Tab Buttons -->
            <div style="display: flex; background: #f0f1f3; border-radius: 12px; padding: 4px; margin-bottom: 25px;">
                <button type="button" id="tab-login" onclick="switchAuthTab('login')" style="flex: 1; padding: 10px; border: none; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; background: #ffffff; color: #111; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: all 0.2s;">Sign In</button>
                <button type="button" id="tab-register" onclick="switchAuthTab('register')" style="flex: 1; padding: 10px; border: none; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; background: transparent; color: #666; transition: all 0.2s;">Create Account</button>
            </div>

            <!-- GOOGLE OAUTH DIRECT SIGN-IN BUTTON -->
            <div style="margin-bottom: 20px;">
                <button type="button" id="google-auth-btn" onclick="triggerGoogleSignIn()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; background: #ffffff; border: 1.5px solid #e1e3e8; border-radius: 12px; font-size: 14px; font-weight: 600; color: #333; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
            </div>

            <!-- OR DIVIDER -->
            <div style="display: flex; align-items: center; margin-bottom: 22px; color: #aaa; font-size: 13px;">
                <div style="flex: 1; height: 1px; background: #e6e8ec;"></div>
                <span style="padding: 0 12px; font-weight: 500;">or use Gmail / Phone</span>
                <div style="flex: 1; height: 1px; background: #e6e8ec;"></div>
            </div>

            <!-- Alert Message Box -->
            <div id="auth-alert" style="display: none; padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; font-weight: 500;"></div>

            <!-- FORM: SIGN IN -->
            <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;">Gmail Address or Phone Number</label>
                    <div style="position: relative;">
                        <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                        <input type="text" id="login-identifier" placeholder="e.g. name@gmail.com or 017xxxxxxxx" required style="width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid #e1e3e8; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; transition: border-color 0.2s;">
                    </div>
                </div>

                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label style="font-size: 13px; font-weight: 600; color: #444;">Password</label>
                        <a href="faq.html" style="font-size: 12px; color: #111; font-weight: 600; text-decoration: none;">Forgot?</a>
                    </div>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required style="width: 100%; padding: 12px 40px 12px 40px; border: 1.5px solid #e1e3e8; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; transition: border-color 0.2s;">
                        <i id="toggle-login-pass" class="fas fa-eye" onclick="togglePasswordVisibility('login-password', 'toggle-login-pass')" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #999; cursor: pointer;"></i>
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" class="btn" style="width: 100%; padding: 13px; font-size: 15px; font-weight: 600; border-radius: 12px; background: #111111; color: #ffffff; border: none; cursor: pointer; margin-top: 8px;">Sign In</button>
            </form>

            <!-- FORM: CREATE ACCOUNT (Hidden by default) -->
            <form id="register-form" style="display: none; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;">Full Name</label>
                    <div style="position: relative;">
                        <i class="fas fa-user-circle" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                        <input type="text" id="reg-name" placeholder="e.g. Asif Sarkar" required style="width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid #e1e3e8; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;">
                    </div>
                </div>

                <div>
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;">Gmail Address or Phone Number</label>
                    <div style="position: relative;">
                        <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                        <input type="text" id="reg-identifier" placeholder="e.g. name@gmail.com or 017xxxxxxxx" required style="width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid #e1e3e8; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;">
                    </div>
                </div>

                <div>
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;">Create Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-key" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                        <input type="password" id="reg-password" placeholder="At least 6 characters" minlength="6" required style="width: 100%; padding: 12px 40px 12px 40px; border: 1.5px solid #e1e3e8; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;">
                        <i id="toggle-reg-pass" class="fas fa-eye" onclick="togglePasswordVisibility('reg-password', 'toggle-reg-pass')" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #999; cursor: pointer;"></i>
                    </div>
                </div>

                <button type="submit" id="reg-submit-btn" class="btn" style="width: 100%; padding: 13px; font-size: 15px; font-weight: 600; border-radius: 12px; background: #111111; color: #ffffff; border: none; cursor: pointer; margin-top: 8px;">Create Account</button>
            </form>

            <!-- USER LOGGED IN VIEW (If already authenticated) -->
            <div id="user-profile-view" style="display: none; text-align: center; padding: 10px 0;">
                <div style="position: relative; display: inline-block; margin-bottom: 15px;">
                    <img id="user-avatar" src="./img/profile_image.jpg" alt="User Avatar" style="width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #111111; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                </div>
                <h3 id="user-name" style="margin: 0 0 5px; font-size: 20px; font-weight: 700; color: #111;">Customer Name</h3>
                <p id="user-contact" style="margin: 0 0 20px; font-size: 13px; color: #666;">user@gmail.com</p>

                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <a href="track-order.html" class="btn" style="width: 100%; padding: 12px; background: #111111; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600;"><i class="fas fa-box"></i> View My Orders</a>
                    <button type="button" onclick="handleUserLogout()" class="btn" style="width: 100%; padding: 12px; background: #dc3545; color: #fff; border-radius: 10px; border: none; font-weight: 600; cursor: pointer;"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>&copy; 2026 Avaroni (আভরণী). All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Tab switching logic
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');
            const alertBox = document.getElementById('auth-alert');

            if (alertBox) alertBox.style.display = 'none';

            if (tab === 'login') {
                loginForm.style.display = 'flex';
                registerForm.style.display = 'none';

                tabLogin.style.background = '#ffffff';
                tabLogin.style.color = '#111';
                tabLogin.style.boxShadow = '0 2px 6px rgba(0,0,0,0.06)';

                tabRegister.style.background = 'transparent';
                tabRegister.style.color = '#666';
                tabRegister.style.boxShadow = 'none';

                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Sign in to manage your account & orders';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'flex';

                tabRegister.style.background = '#ffffff';
                tabRegister.style.color = '#111';
                tabRegister.style.boxShadow = '0 2px 6px rgba(0,0,0,0.06)';

                tabLogin.style.background = 'transparent';
                tabLogin.style.color = '#666';
                tabLogin.style.boxShadow = 'none';

                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Sign up with Gmail or Phone number in seconds';
            }
        }

        // Toggle password visibility
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Show status alert
        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('auth-alert');
            if (!alertBox) return;
            alertBox.style.display = 'block';
            alertBox.textContent = msg;

            if (type === 'success') {
                alertBox.style.background = '#d1e7dd';
                alertBox.style.color = '#0f5132';
                alertBox.style.border = '1px solid #badbcc';
            } else {
                alertBox.style.background = '#f8d7da';
                alertBox.style.color = '#842029';
                alertBox.style.border = '1px solid #f5c2c7';
            }
        }

        // Handle Customer Sign In Submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('login-submit-btn');

            if (!identifier || !password) {
                showAlert('Please enter your Gmail or Phone number and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/user/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await res.json();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';

                if (data.success) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userProfile', JSON.stringify(data.user));
                    showAlert('Signed in successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        checkUserSession();
                    }, 1000);
                } else {
                    showAlert(data.message || 'Login failed.');
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
                showAlert('Connection error. Please try again.');
            }
        });

        // Handle Customer Registration Submission
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const identifier = document.getElementById('reg-identifier').value.trim();
            const password = document.getElementById('reg-password').value;
            const submitBtn = document.getElementById('reg-submit-btn');

            if (!name || !identifier || !password) {
                showAlert('Please fill in all fields.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                const res = await fetch('/api/user/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, identifier, password })
                });

                const data = await res.json();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';

                if (data.success) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userProfile', JSON.stringify(data.user));
                    showAlert('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        checkUserSession();
                    }, 1000);
                } else {
                    showAlert(data.message || 'Registration failed.');
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
                showAlert('Connection error. Please try again.');
            }
        });

        // Trigger Google Sign-In via Google Identity API or fallback prompt
        function triggerGoogleSignIn() {
            if (window.google && window.google.accounts && window.google.accounts.id) {
                window.google.accounts.id.prompt();
            } else {
                // Interactive fallback for Google Auth
                const email = prompt("Enter your Google Account Gmail address to sign in:");
                if (email && email.includes('@')) {
                    handleGoogleAuthResponse({
                        email: email.trim().toLowerCase(),
                        name: email.split('@')[0],
                        googleId: 'g_' + Date.now(),
                        avatar: './img/profile_image.jpg'
                    });
                }
            }
        }

        // Handle Google OAuth Payload Response
        async function handleGoogleAuthResponse(googlePayload) {
            try {
                const res = await fetch('/api/user/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(googlePayload)
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userProfile', JSON.stringify(data.user));
                    showAlert('Google Sign-In successful!', 'success');
                    setTimeout(() => {
                        checkUserSession();
                    }, 1000);
                } else {
                    showAlert(data.message || 'Google Sign-In failed.');
                }
            } catch (err) {
                showAlert('Google Auth connection error.');
            }
        }

        // Initialize Google Identity Services
        window.onload = function () {
            checkUserSession();
            if (window.google && window.google.accounts && window.google.accounts.id) {
                window.google.accounts.id.initialize({
                    client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // Handled dynamically
                    callback: function(response) {
                        try {
                            const base64Url = response.credential.split('.')[1];
                            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                            const payload = JSON.parse(window.atob(base64));
                            handleGoogleAuthResponse({
                                googleId: payload.sub,
                                email: payload.email,
                                name: payload.name,
                                avatar: payload.picture
                            });
                        } catch(e) {
                            console.error("Google token decode error:", e);
                        }
                    }
                });
            }
        };

        // Check and render active user session dynamically
        function checkUserSession() {
            const token = localStorage.getItem('userToken');
            const savedProfile = localStorage.getItem('userProfile');

            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const googleBtn = document.getElementById('google-auth-btn');
            const userProfileView = document.getElementById('user-profile-view');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');

            if (token && savedProfile) {
                try {
                    const user = JSON.parse(savedProfile);
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'none';
                    if (googleBtn) googleBtn.style.display = 'none';

                    document.getElementById('user-name').textContent = user.username || 'Customer';
                    document.getElementById('user-contact').textContent = user.email || user.phone || '';
                    if (user.avatar) {
                        document.getElementById('user-avatar').src = user.avatar;
                    }

                    userProfileView.style.display = 'block';
                    authTitle.textContent = 'Account Dashboard';
                    authSubtitle.textContent = 'Welcome, ' + (user.username || 'Customer');
                } catch(e) {
                    localStorage.removeItem('userToken');
                    localStorage.removeItem('userProfile');
                }
            } else {
                if (userProfileView) userProfileView.style.display = 'none';
                if (googleBtn) googleBtn.style.display = 'flex';
                switchAuthTab('login');
            }
        }

        // Handle Logout
        function handleUserLogout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('userProfile');
            showAlert('Signed out successfully.', 'success');
            setTimeout(() => {
                checkUserSession();
            }, 800);
        }
    </script>
</body>
</html>
