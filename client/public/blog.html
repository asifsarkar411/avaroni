    <style>
        .blog-hero {
            background: linear-gradient(135deg, #111 0%, #333 100%);
            color: #fff;
            padding: 50px 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .blog-hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffb6d8;
        }

        .blog-hero p {
            font-size: 16px;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto;
        }

        .blog-container {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .blog-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(230,0,80,0.15);
        }

        .blog-card-img {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .blog-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e60050;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 15px;
            text-transform: uppercase;
        }

        .blog-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .blog-meta {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
        }

        .blog-meta i {
            color: #e60050;
            margin-right: 5px;
        }

        .blog-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .blog-excerpt {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .blog-read-more {
            color: #e60050;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.2s ease;
            cursor: pointer;
        }

        .blog-read-more:hover {
            gap: 10px;
        }

        /* Modal styling for reading blog post */
        .blog-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }

        .blog-modal-box {
            background: #fff;
            max-width: 750px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .blog-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }

        .blog-modal-close:hover {
            color: #e60050;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

        <a href="track-order.html"><i class="fas fa-truck"></i> Track Order</a>

    <div class="blog-hero">
        <h1><i class="fas fa-newspaper"></i> AVARONI Style & Fashion Blog</h1>
        <p>Discover the latest traditional dress trends, hand-crafted ornament styling tips, and festive wardrobe guides for every season.</p>
    </div>

    <div class="blog-container">
        <div class="blog-grid" id="blog-grid">
            <div style="text-align: center; padding: 40px; grid-column: 1 / -1; color: #666;">
                <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #e60050; margin-bottom: 10px;"></i>
                <p>Loading the latest blogs...</p>
            </div>
        </div>
    </div>

    <!-- Blog Article Detail Modal -->
    <div id="blog-modal" class="blog-modal-overlay" style="display:none;">
        <div class="blog-modal-box">
            <span class="blog-modal-close" onclick="closeBlogModal()">&times;</span>
            <div id="blog-modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let articles = [];

        async function fetchBlogs() {
            try {
                const response = await fetch('/api/blogs');
                if (!response.ok) throw new Error('Failed to fetch blogs');
                
                const data = await response.json();
                articles = data.blogs || [];
                renderBlogs();
            } catch (error) {
                console.error("Error fetching blogs:", error);
                document.getElementById('blog-grid').innerHTML = `
                    <div style="text-align: center; padding: 40px; grid-column: 1 / -1; color: #b91c1c;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>Failed to load blogs. Please try again later.</p>
                    </div>
                `;
            }
        }

        function renderBlogs() {
            const blogGrid = document.getElementById('blog-grid');
            
            if (articles.length === 0) {
                blogGrid.innerHTML = `
                    <div style="text-align: center; padding: 40px; grid-column: 1 / -1; color: #666;">
                        <i class="fas fa-folder-open" style="font-size: 24px; margin-bottom: 10px; color: #ccc;"></i>
                        <p>No blogs published yet. Check back soon!</p>
                    </div>
                `;
                return;
            }

            blogGrid.innerHTML = articles.map((article, index) => {
                // Strip HTML tags to create a short excerpt
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = article.description || '';
                const textContent = tempDiv.textContent || tempDiv.innerText || '';
                const excerpt = textContent.length > 120 ? textContent.substring(0, 120) + '...' : textContent;
                
                const dateString = new Date(article.createdAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // Calculate estimated read time (avg 200 words per minute)
                const wordCount = textContent.split(/\s+/).length;
                const readTime = Math.max(1, Math.ceil(wordCount / 200));

                return `
                <div class="blog-card" data-aos="fade-up" data-aos-delay="${(index % 3) * 100}">
                    <div class="blog-card-img" style="background-image: url('${article.imageUrl || './img/profile_image.jpg'}');">
                        <span class="blog-tag">Blog</span>
                    </div>
                    <div class="blog-content">
                        <div class="blog-meta">
                            <span><i class="far fa-calendar-alt"></i> ${dateString}</span>
                            <span><i class="far fa-clock"></i> ${readTime} min read</span>
                        </div>
                        <h3 class="blog-title">${article.title || 'Untitled'}</h3>
                        <p class="blog-excerpt">${excerpt}</p>
                        <span class="blog-read-more" onclick="openBlogModal('${article._id}')">Read Full Article <i class="fas fa-arrow-right"></i></span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openBlogModal(id) {
            const article = articles.find(b => b._id === id);
            if (!article) return;
            
            const dateString = new Date(article.createdAt).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const body = document.getElementById('blog-modal-body');
            body.innerHTML = `
                <span style="background:#e60050; color:#fff; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:700;">Blog</span>
                <p style="color:#888; font-size:13px; margin: 10px 0;"><i class="far fa-calendar-alt"></i> ${dateString}</p>
                <h2 style="color:#222; margin-bottom:15px; font-size:22px;">${article.title}</h2>
                ${article.imageUrl ? `<img src="${article.imageUrl}" alt="${article.title}" style="width:100%; max-height:400px; object-fit:cover; border-radius:8px; margin-bottom:20px;">` : ''}
                <hr style="border:0; border-top:1px solid #eee; margin-bottom:20px;">
                <div class="ql-editor" style="padding: 0; font-size:15px; line-height:1.7; color:#444;">${article.description}</div>
            `;
            document.getElementById('blog-modal').style.display = 'flex';
        }

        function closeBlogModal() {
            document.getElementById('blog-modal').style.display = 'none';
        }

        // Fetch blogs on page load
        document.addEventListener('DOMContentLoaded', fetchBlogs);
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof AOS !== "undefined") {
                AOS.init({
                    duration: 800,
                    once: true,
