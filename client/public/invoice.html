<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | AVARONI</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #111111;
            --accent-color: #e60050;
            --text-main: #333333;
            --text-light: #777777;
            --bg-color: #f4f5f7;
            --border-color: #eaeaea;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-bar {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-print {
            background-color: #ffffff;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-print:hover {
            background-color: #f9f9f9;
        }

        .btn-download {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(17, 17, 17, 0.2);
        }

        .btn-download:hover {
            background-color: #333333;
            transform: translateY(-1px);
        }

        .invoice-wrapper {
            background: #ffffff;
            width: 100%;
            max-width: 850px;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Subtle decorative gradient at top */
        .invoice-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #111 0%, #333 50%, #111 100%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .brand h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary-color);
        }

        .brand p {
            margin: 5px 0 0;
            font-size: 12px;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .invoice-details {
            text-align: right;
        }

        .invoice-details h2 {
            margin: 0 0 10px;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .invoice-details p {
            margin: 4px 0;
            font-size: 14px;
            color: var(--text-light);
        }

        .invoice-details strong {
            color: var(--primary-color);
            font-weight: 600;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
            background: #fafafa;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
        }

        .info-section h3 {
            margin: 0 0 12px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .info-section p {
            margin: 0 0 6px;
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.5;
        }

        .info-section p.name {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }

        th {
            background: #f9f9f9;
            padding: 15px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--primary-color);
        }

        th:last-child, td:last-child {
            text-align: right;
        }

        th:nth-child(3), td:nth-child(3) {
            text-align: center;
        }

        td {
            padding: 16px 15px;
            font-size: 14px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .item-name {
            font-weight: 500;
            color: var(--primary-color);
        }

        .totals-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 50px;
        }

        .totals-box {
            width: 350px;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .totals-row.discount {
            color: var(--accent-color);
        }

        .totals-row.grand-total {
            background: var(--primary-color);
            color: #ffffff;
            padding: 18px 15px;
            border-radius: 6px;
            margin-top: 15px;
            border: none;
            align-items: center;
        }

        .grand-total-label {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grand-total-amount {
            font-size: 20px;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }

        .footer p.thank-you {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0 0 8px;
        }

        .footer p.note {
            font-size: 12px;
            color: var(--text-light);
            margin: 4px 0;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 18px;
            font-weight: 500;
            color: var(--primary-color);
        }

        /* Print Styles */
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }
            .action-bar {
                display: none;
            }
            .invoice-wrapper {
                box-shadow: none;
                border: none;
                padding: 20px 0;
                max-width: 100%;
            }
            .invoice-wrapper::before {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <i class="fas fa-circle-notch fa-spin" style="margin-right: 10px;"></i> Loading Invoice...
    </div>

    <div class="action-bar">
        <button class="btn btn-print" onclick="window.print()">
            <i class="fas fa-print"></i> Print
        </button>
        <button class="btn btn-download" onclick="downloadAsPDF()">
            <i class="fas fa-file-pdf"></i> Download PDF
        </button>
    </div>

    <div class="invoice-wrapper" id="invoice-content">
        <!-- Content injected via JS -->
    </div>

    <!-- html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderNumber = urlParams.get('orderNumber');
        let currentOrder = null;

        if (!orderNumber) {
            document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-circle" style="color: #e60050; margin-right: 10px;"></i> Invalid Order Number';
        } else {
            fetchOrderDetails(orderNumber);
        }

        async function fetchOrderDetails(orderNo) {
            try {
                const response = await fetch(`/api/orders/${orderNo}`);
                const data = await response.json();
                
                if (data.success && data.order) {
                    currentOrder = data.order;
                    renderInvoice(currentOrder);
                    document.getElementById('loading').style.display = 'none';
                } else {
                    document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #e60050; margin-right: 10px;"></i> Order not found';
                }
            } catch (error) {
                console.error("Error fetching order:", error);
                document.getElementById('loading').innerHTML = '<i class="fas fa-times-circle" style="color: #e60050; margin-right: 10px;"></i> Failed to load invoice';
            }
        }

        function renderInvoice(order) {
            const orderDate = new Date(order.orderDate || Date.now()).toLocaleDateString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric'
            });

            let itemsHtml = '';
            let subtotal = 0;
            
            const cartItems = order.cartItems || [];
            cartItems.forEach((item, index) => {
                const price = Number(item.price);
                const quantity = Number(item.quantity);
                const itemTotal = price * quantity;
                subtotal += itemTotal;
                
                itemsHtml += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="item-name">${item.name}</td>
                        <td>${quantity}</td>
                        <td>৳${price.toLocaleString()}</td>
                        <td><strong>৳${itemTotal.toLocaleString()}</strong></td>
                    </tr>
                `;
            });

            const discount = order.discountAmount !== undefined ? Number(order.discountAmount) : 0;
            const delivery = order.shippingFee !== undefined ? Number(order.shippingFee) : (order.totalAmount - subtotal + discount > 0 ? order.totalAmount - subtotal + discount : 0);

            const content = `
                <div class="header">
                    <div class="brand">
                        <h1>AVARONI</h1>
                        <p>Premium Fashion & Beauty</p>
                    </div>
                    <div class="invoice-details">
                        <h2>INVOICE</h2>
                        <p><strong>Order No:</strong> ${order.orderNumber}</p>
                        <p><strong>Date:</strong> ${orderDate}</p>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-section">
                        <h3>Billed To</h3>
                        <p class="name">${order.customerName}</p>
                        <p>${order.phone}</p>
                        <p>${order.email}</p>
                        <p style="margin-top: 8px; color: #555;">${order.address}</p>
                    </div>
                    <div class="info-section" style="text-align: right;">
                        <h3>Payment Information</h3>
                        <p><strong>Method:</strong> ${order.paymentMethod || 'Cash on Delivery'}</p>
                        <p><strong>TrxID:</strong> ${order.transactionId || 'N/A'}</p>
                        <div class="status-badge">${order.status || 'Pending'}</div>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Item Description</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsHtml}
                    </tbody>
                </table>

                <div class="totals-section">
                    <div class="totals-box">
                        <div class="totals-row">
                            <span>Subtotal</span>
                            <strong>৳${subtotal.toLocaleString()}</strong>
                        </div>
                        <div class="totals-row">
                            <span>Delivery Fee</span>
                            <strong>৳${delivery.toLocaleString()}</strong>
                        </div>
                        ${discount > 0 ? `
                        <div class="totals-row discount">
                            <span>Discount ${order.promoCode ? `(${order.promoCode})` : ''}</span>
                            <strong>-৳${discount.toLocaleString()}</strong>
                        </div>
                        ` : ''}
                        <div class="totals-row grand-total">
                            <span class="grand-total-label">Grand Total</span>
                            <span class="grand-total-amount">৳${Number(order.totalAmount).toLocaleString()}</span>
                        </div>
                    </div>
                </div>

                <div class="footer">
                    <p class="thank-you">Thank you for shopping with AVARONI!</p>
                    <p class="note">This is a computer-generated invoice and does not require a signature.</p>
                    <p class="note">If you have any questions concerning this invoice, contact support@avaroni.com.</p>
                </div>
            `;

            document.getElementById('invoice-content').innerHTML = content;
        }

        function downloadAsPDF() {
            if (!currentOrder) return;
            
            const element = document.getElementById('invoice-content');
            
            // Temporary styles for PDF rendering to ensure it fits perfectly
            element.style.boxShadow = 'none';
            element.style.border = 'none';
            element.style.padding = '30px';
            element.style.maxWidth = '100%';

            const opt = {
                margin:       [0.3, 0],
                filename:     `Invoice_${currentOrder.orderNumber}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                // Restore styles
                element.style.boxShadow = '';
                element.style.border = '';
                element.style.padding = '';
                element.style.maxWidth = '';
            });
        }
    </script>
</body>
</html>
